# Local dev stack.
#
#   docker compose up --build
#
# GPU: worker1 reserves an NVIDIA GPU. Before running this for the first
# time, confirm Docker Desktop's GPU passthrough actually works:
#
#   docker run --rm --gpus all nvidia/cuda:12.0.0-base-ubuntu22.04 nvidia-smi
#
# If that fails (rather than printing your GPU info), either fix GPU
# passthrough in Docker Desktop settings, or fall back to CPU-only by
# deleting worker1's `deploy:` block below — worker2 has no GPU
# reservation and works either way.

services:

  # ── API Gateway ──────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    # Dev override: hot-reload. (Prod image runs without --reload — see compose.prod.)
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - WORKER_URLS=http://worker1:11434,http://worker2:11434
      - REDIS_HOST=redis
      - MEMORY_DB_HOST=postgres
      - MEMORY_DB_USER=fleet
      - MEMORY_DB_PASSWORD=fleet_dev_password
      # .env's STANDBY_WORKER_URLS=http://localhost:11435 is for host/native
      # dev — "localhost" inside this container means the gateway container
      # itself, not worker2. Both workers are already in WORKER_URLS above,
      # so there's nothing meaningful to register; explicitly empty this out
      # rather than let it fail confusingly (same fix already applied in
      # docker-compose.prod.yml).
      - STANDBY_WORKER_URLS=
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker1:
        condition: service_started
      worker2:
        condition: service_started
    volumes:
      - ./config:/app/config
      - ./router:/app/router
      - ./workers:/app/workers
      - ./context:/app/context
      - ./memory:/app/memory
      - ./job_queue:/app/job_queue
      - ./gateway:/app/gateway
    networks:
      - inference-net

  # ── Redis Queue ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - inference-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Memory storage (working/episodic memory, §18) ────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fleet
      - POSTGRES_USER=fleet
      - POSTGRES_PASSWORD=fleet_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inference-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fleet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama Worker 1 ───────────────────────────────────
  worker1:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_worker1:/root/.ollama
    networks:
      - inference-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Ollama Worker 2 ───────────────────────────────────
  worker2:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_worker2:/root/.ollama
    networks:
      - inference-net

  # ── Prometheus ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - inference-net

  # ── Grafana ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - inference-net

volumes:
  ollama_worker1:
  ollama_worker2:
  grafana_data:
  postgres_data:

networks:
  inference-net:
    driver: bridge
