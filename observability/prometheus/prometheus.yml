global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: "/metrics"
    static_configs:
      # gateway as a compose service:
      - targets: ["gateway:8000"]
      # gateway running on the host (dev: `uvicorn` outside docker):
      - targets: ["host.docker.internal:8000"]