apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: llm-engine
  labels:
    app: gateway
spec:
  replicas: 2                  # each replica runs its own queue-consumer loop
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/REPLACE_ME/llm-gateway:latest   # built from gateway/Dockerfile
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: llm-engine
  labels:
    app: gateway
spec:
  type: ClusterIP             # change to LoadBalancer to expose externally
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
