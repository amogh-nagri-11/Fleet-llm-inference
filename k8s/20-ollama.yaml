apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-engine
  labels:
    app: ollama
spec:
  replicas: 1                 # KEDA scales this (see 40-keda-scaledobject.yaml)
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
          # Pull the default model on startup so a freshly-scaled pod is usable.
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sleep 3 && ollama pull llama3:latest || true"]
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "12Gi"
              # GPU workers (RunPod / GKE GPU nodes): uncomment and ensure the
              # NVIDIA device plugin / GPU operator is installed on the cluster.
              # nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          emptyDir: {}          # swap for a PVC to cache pulled models across restarts
      # Schedule onto GPU nodes when available:
      # nodeSelector:
      #   cloud.google.com/gke-accelerator: nvidia-tesla-t4
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm-engine
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
